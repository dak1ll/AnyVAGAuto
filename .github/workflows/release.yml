name: Build, Test, and Release AnyAuto

on:
  push:
    branches: [main, feat/mod-improvements]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform and build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare signing and release version metadata
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
              echo "::error::Release tag builds require KEYSTORE_B64, KS_PASS, KEY_ALIAS, and KEY_PASS secrets." >&2
              exit 1
            fi
            TAG_VER="${GITHUB_REF_NAME#v}"
            TAG_VER="${TAG_VER#V}"
            echo "VERSION_NAME=$TAG_VER" >> "$GITHUB_ENV"
            echo "VERSION_CODE=$((11 + ${GITHUB_RUN_NUMBER:-1}))" >> "$GITHUB_ENV"
          fi
          if [ -n "$KEYSTORE_B64" ]; then
            if [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
              echo "::error::KEYSTORE_B64 is configured, so KS_PASS, KEY_ALIAS, and KEY_PASS must also be set." >&2
              exit 1
            fi
            mkdir -p keys
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n' | base64 -d > keys/release.keystore
            echo "KEYSTORE=keys/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build and verify anyauto.apk
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          chmod +x build.sh
          ./build.sh verify

      - name: Run JUnit 4 unit tests
        run: |
          mkdir -p build/test build/test-libs
          curl -fsSL https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o build/test-libs/junit-4.13.2.jar
          curl -fsSL https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o build/test-libs/hamcrest-core-1.3.jar
          . libs/deps.env
          LIB_CP=$(echo "$LIB_JARS" | tr ' ' ':')
          CP="build/classes:$LIB_CP:$ANDROID_HOME/platforms/android-35/android.jar:build/test-libs/junit-4.13.2.jar:build/test-libs/hamcrest-core-1.3.jar"
          javac --release 17 -encoding UTF-8 -classpath "$CP" -d build/test \
            test/com/mag/anyauto/UpdaterTest.java \
            test/com/mag/anyauto/AppProfilePrefsTest.java \
            test/com/mag/anyauto/PhonePowerWakePolicyTest.java \
            test/com/mag/anyauto/MirrorHistoryTest.java \
            test/com/mag/anyauto/OemHealthTest.java
          java -cp "build/test:$CP" org.junit.runner.JUnitCore \
            com.mag.anyauto.UpdaterTest \
            com.mag.anyauto.AppProfilePrefsTest \
            com.mag.anyauto.PhonePowerWakePolicyTest \
            com.mag.anyauto.MirrorHistoryTest \
            com.mag.anyauto.OemHealthTest

      - name: Check strings.xml / values-ru parity
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET

          def load(path):
              root = ET.parse(path).getroot()
              items = {}
              for el in root:
                  key = (el.tag, el.attrib["name"])
                  if el.tag == "plurals":
                      txt = " | ".join("".join(item.itertext()) for item in el)
                  else:
                      txt = "".join(el.itertext())
                  items[key] = sorted(re.findall(r"%(?:\d+\$)?[sd]", txt))
              return items

          en = load("res/values/strings.xml")
          ru = load("res/values-ru/strings.xml")
          missing = sorted(set(en) - set(ru))
          extra = sorted(set(ru) - set(en))
          if missing or extra:
              raise SystemExit(f"Key mismatch: missing={missing}, extra={extra}")
          fmt_diff = [k for k in sorted(en) if k[0] == "string" and en[k] != ru[k]]
          if fmt_diff:
              raise SystemExit(f"Format specifier mismatch: {fmt_diff}")
          print(f"PARITY OK: {len(en)} resources matched in res/values and res/values-ru")
          PY

      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ ! -f keys/release.keystore ]; then
            echo "::error::Refusing to publish release without persistent release keystore." >&2
            exit 1
          fi
          mkdir -p dist
          cp anyauto.apk "dist/AnyAuto-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AnyAuto-${{ github.ref_name }}.apk
          generate_release_notes: true
